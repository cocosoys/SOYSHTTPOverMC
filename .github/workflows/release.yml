name: Build & Auto Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 手动触发：仅构建并上传 artifacts（不创建 Release）

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 全量构建需多 JDK：common/core/v1_6x/v1_7x 走默认 JDK8，
      # v1_16x→JDK11、v1_20x→JDK17、v1_21x→JDK21、v1_26x→JDK25（经 maven-toolchains-plugin 切换）。
      # 数组首个版本 = runner 默认 JAVA_HOME（Maven 主进程跑在 JDK8 上）；
      # 多版本安装后自动导出 $JAVA_HOME_{VER}_X64 环境变量，供下一步生成 toolchains.xml。
      - name: Set up JDKs (8/11/17/21/25)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            8
            11
            17
            21
            25
          # 固定 Maven 版本：runner 预装 Maven（3.9.13+）环境存在“生命周期重复执行”问题，
          # setup-java 安装官方发行版 3.9.12（本地已验证单次执行 + BUILD SUCCESS）以消除环境差异。
          maven-version: '3.9.12'
          cache: maven

      # 获取tag版本，去除前缀v；非tag触发VERSION为空字符串
      - name: Get tag version
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            RAW_TAG=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$RAW_TAG" >> $GITHUB_OUTPUT
          else
            echo "VERSION=" >> $GITHUB_OUTPUT
          fi

      # 动态生成 Linux 版 toolchains.xml（覆盖入库的 Windows 绝对路径版）：
      # 入库 toolchains.xml 的 jdkHome 是本机 Windows 路径（D:\WorkTools\JDK\*），CI Linux runner 上不存在，
      # 各 adapter 模块 require toolchain 时会全部失效导致构建失败（run #14 失败根因）。
      # setup-java 多版本安装后自动导出 $JAVA_HOME_{VER}_X64，按其生成 toolchain 条目；
      # provides.version 与各 adapter pom 的 require version 一一对应（1.8 / 11 / 17 / 21 / 25）。
      # .mvn/maven.config 固定 --toolchains toolchains.xml（项目根相对路径），覆盖后即生效。
      - name: Generate Linux toolchains.xml
        run: |
          cat > toolchains.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides><version>1.8</version><vendor>temurin</vendor></provides>
              <configuration><jdkHome>$JAVA_HOME_8_X64</jdkHome></configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides><version>11</version><vendor>temurin</vendor></provides>
              <configuration><jdkHome>$JAVA_HOME_11_X64</jdkHome></configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides><version>17</version><vendor>temurin</vendor></provides>
              <configuration><jdkHome>$JAVA_HOME_17_X64</jdkHome></configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides><version>21</version><vendor>temurin</vendor></provides>
              <configuration><jdkHome>$JAVA_HOME_21_X64</jdkHome></configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides><version>25</version><vendor>temurin</vendor></provides>
              <configuration><jdkHome>$JAVA_HOME_25_X64</jdkHome></configuration>
            </toolchain>
          </toolchains>
          EOF
          echo "===== generated toolchains.xml ====="
          cat toolchains.xml

      # 组装Maven参数：只有tag触发时追加 -Drevision=xxx
      # 注意：不用 clean —— CI 每次是全新 runner + 干净 checkout，无 target 残留；
      # 且去掉 clean 可免疫 CI 环境的“生命周期重复执行”：第 2 次执行时 .flattened-pom.xml
      # 不会被 clean 删除，flatten 读到已存在文件不崩溃（此前两次 CI 失败均因此机制）。
      - name: Build modules (Spigot core + low-version adapters)
        run: |
          mvn -version
          MAVEN_ARGS="-B package -DskipTests"
          if [[ -n "${{ steps.get_version.outputs.VERSION }}" ]]; then
            MAVEN_ARGS+=" -Drevision=${{ steps.get_version.outputs.VERSION }}"
          fi
          echo "Maven arguments: $MAVEN_ARGS"
          mvn $MAVEN_ARGS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soyshttpovermc-jars
          path: |
            core/target/SOYSHTTPOverMC-1_12-*.jar
            adapter/v1_6x/target/SOYSHTTPOverMC-1_6-*.jar
            adapter/v1_7x/target/SOYSHTTPOverMC-1_7-*.jar
          if-no-files-found: error

      - name: Get tag-commit short message
        id: get_commit
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s "${GITHUB_REF}")
          echo "COMMIT_MSG<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & upload jars
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          body: |
            ## ✨更新说明
            ${{ steps.get_commit.outputs.COMMIT_MSG }}

            ### 📦 下载
            - `SOYSHTTPOverMC-1_12-${{ steps.get_version.outputs.VERSION }}.jar` —— Spigot 1.12.2 后端插件（当前服务器，单服或群组服子服，放各子服 plugins/）
            - `SOYSHTTPOverMC-1_6-${{ steps.get_version.outputs.VERSION }}.jar` —— 1.6.x 低版本适配（JDK8 运行）
            - `SOYSHTTPOverMC-1_7-${{ steps.get_version.outputs.VERSION }}.jar` —— 1.7.x 适配（JDK8 运行）
            - `SOYSHTTPOverMC-Proxy-${{ steps.get_version.outputs.VERSION }}.jar` —— BungeeCord/Velocity 代理端插件（本地构建，创建 Release 后手动附加）
          files: |
            core/target/SOYSHTTPOverMC-1_12-*.jar
            adapter/v1_6x/target/SOYSHTTPOverMC-1_6-*.jar
            adapter/v1_7x/target/SOYSHTTPOverMC-1_7-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
