name: Build & Auto Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 手动触发：仅构建并上传 artifacts（不创建 Release）

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      # 安装本地vendored依赖
      - name: Install vendored deps
        run: |
          mvn -B -q install:install-file -Dfile=lib/packetlib-1.2.jar \
            -DgroupId=com.github.steveice10 -DartifactId=packetlib -Dversion=1.2 -Dpackaging=jar
          mvn -B -q install:install-file -Dfile=lib/opennbt-1.0.jar \
            -DgroupId=com.github.steveice10 -DartifactId=opennbt -Dversion=1.0 -Dpackaging=jar
          mvn -B -q install:install-file -Dfile=lib/bungeecord-api-1.12.2-build1867-slim.jar \
            -DgroupId=net.md_5 -DartifactId=bungeecord-api -Dversion=1.12.2-build1867 -Dpackaging=jar

      # 获取tag版本，去除前缀v；非tag触发VERSION为空字符串
      - name: Get tag version
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            RAW_TAG=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$RAW_TAG" >> $GITHUB_OUTPUT
          else
            echo "VERSION=" >> $GITHUB_OUTPUT
          fi

      # 组装Maven参数：只有tag触发时追加 -Drevision=xxx
      - name: Build main plugin (Spigot)
        run: |
          MAVEN_ARGS="-B clean package -DskipTests"
          if [[ -n "${{ steps.get_version.outputs.VERSION }}" ]]; then
            MAVEN_ARGS+=" -Drevision=${{ steps.get_version.outputs.VERSION }}"
          fi
          echo "Maven arguments: $MAVEN_ARGS"
          mvn $MAVEN_ARGS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soyshttpovermc-jars
          path: |
            target/SOYSHTTPOverMC.jar
          if-no-files-found: error

      - name: Get tag-commit short message
        id: get_commit
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s "${GITHUB_REF}")
          echo "COMMIT_MSG<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & upload jars
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          body: |
            ## ✨更新说明
            ${{ steps.get_commit.outputs.COMMIT_MSG }}

            ### 📦 下载
            - `SOYSHTTPOverMC-*.jar` —— Bukkit/Spigot 后端插件（单服或群组服子服，放各子服 plugins/）
          files: |
            target/SOYSHTTPOverMC-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
