syntax = "proto3";

option java_package = "soys.soyshttpovermc.proto";
option java_outer_classname = "FrameProto";

message HttpRequestFrame {
    int64 request_id = 1;
    string method = 2;
    string path = 3;
    map<string, string> headers = 4;
    bytes body = 5;
    int32 fragment_index = 6;
    int32 total_fragments = 7;
}

message HttpResponseFrame {
    int64 request_id = 1;
    int32 status_code = 2;
    map<string, string> headers = 3;
    bytes body = 4;
    int32 fragment_index = 5;
    int32 total_fragments = 6;
}
