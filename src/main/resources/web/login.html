<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录窗口页面</title>
<style>
  :root {
    --bg: #0a0a12; --panel: #12121f; --line: #1f6feb55; --accent: #1f6feb;
    --cyan: #5cf; --green: #2ec27e; --red: #f96; --text: #cfe; --dim: #789;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, "Segoe UI", Arial, sans-serif; min-height: 100vh; }
  header { padding: 18px 24px; border-bottom: 1px solid var(--line);
           background: #0d0d18; display: flex; align-items: baseline; gap: 12px; }
  header h1 { margin: 0; font-size: 18px; color: var(--cyan); }
  header small { color: var(--dim); }
  main { max-width: 720px; margin: 24px auto; padding: 0 16px; display: grid; gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; }
  .card h2 { margin: 0 0 12px; font-size: 14px; color: var(--cyan); }
  .info { display: grid; gap: 6px; font-size: 13px; color: #9ab; margin-bottom: 14px; }
  .info b { color: var(--text); }
  .btn { display: inline-block; padding: 9px 16px; margin: 4px 6px 4px 0; border: 0; border-radius: 8px;
         background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; }
  .btn.ghost { background: transparent; border: 1px solid #2a2a40; color: var(--text); }
  .btn.danger { background: #b5443a; }
  .btn:hover { filter: brightness(1.15); }
  #result { margin-top: 12px; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  .ok { color: var(--green); } .err { color: var(--red); } .dim { color: var(--dim); }
  .badge { display: inline-block; padding: 1px 8px; margin-left: 6px; border-radius: 10px;
          font-size: 11px; color: #ffd; background: #b5641f; vertical-align: middle; }
  .badge.okb { background: #1f6f3b; color: #dfd; }
</style>
</head>
<body>
<header><h1>登录窗口页面</h1><small>SOYSHTTPOverMC · 遇到权限校验时自动弹出登录窗口</small></header>

<main>
  <div class="card">
    <h2>当前登录状态</h2>
    <div class="info" id="meInfo"><span class="dim">正在查询登录状态…</span></div>
    <button class="btn" onclick="SoysAuth.openLogin()">打开登录窗口</button>
    <button class="btn ghost" onclick="refreshMe()">查看登录信息</button>
    <button class="btn ghost" onclick="testProtected()">测试受保护接口 /api/status</button>
    <button class="btn danger" onclick="doLogout()">退出登录</button>
    <div id="result"></div>
  </div>

  <div class="card">
    <h2>使用说明</h2>
    <div class="info">
      <span>· 登录窗口弹出时机：访问受保护接口（如 <b>/api/status</b>）返回 401/403 时自动弹出；</span>
      <span>· 输入 <b>玩家名 + AuthMe 密码</b> 完成登录，服务端校验通过后签发会话令牌；</span>
      <span>· 令牌保存在浏览器（localStorage + Cookie），之后请求自动携带 <b>Authorization: Bearer</b>；</span>
      <span>· 令牌与玩家绑定，权限镜像玩家游戏内 Bukkit 权限（如 soyshttp:api:status）。</span>
    </div>
  </div>
</main>

<script src="/soys-auth.js"></script>
<script>
  function refreshMe() {
  SoysAuth.request('/api/auth/me').then(function (r) {
    var info = document.getElementById('meInfo');
    if (r.code === 200 && r.data) {
      var modeTag = r.data.mode === 'offline'
        ? '<span class="badge">离线模式登录</span>'
        : '<span class="badge okb">在线登录</span>';
      info.innerHTML = '<span>登录状态：<b>已登录</b> ' + modeTag + '</span>' +
        '<span>玩家：<b>' + escapeHtml(r.data.player) + '</b>　游戏在线：<b>' + (r.data.online ? '是' : '否') + '</b></span>' +
        (r.data.mode === 'offline' ? '<span class="dim">玩家不在线，当前为离线模式登录；进游戏登录后自动升级为在线令牌。</span>' : '');
    } else {
      info.innerHTML = '<span>登录状态：<b style="color:#f96">未登录</b></span><span class="dim">' + escapeHtml(r.msg || '') + '</span>';
    }
  }).catch(function (e) {
    document.getElementById('meInfo').innerHTML = '<span class="err">查询失败: ' + escapeHtml(String(e)) + '</span>';
  });
}

function testProtected() {
  // 用 authFetch 访问受保护接口：未登录 → 自动弹出登录窗口 → 登录成功自动重试
  showResult('正在请求 /api/status …（未登录时会自动弹出登录窗口）', false);
  SoysAuth.authFetch('/api/status').then(function (r) {
    showResult('code=' + r.code + '　' + r.msg + (r.data ? '\n' + JSON.stringify(r.data, null, 2) : ''), r.code === 200);
  }).catch(function (e) {
    showResult('请求失败: ' + (e && e.message ? e.message : e), false);
  });
}

function doLogout() {
  SoysAuth.request('/api/auth/logout', { method: 'POST' }).then(function (r) {
    SoysAuth.setToken(null);
    showResult('已退出登录：' + (r.msg || 'ok'), true);
    refreshMe();
  }).catch(function (e) { showResult('退出失败: ' + e, false); });
}

function showResult(text, ok) {
  var el = document.getElementById('result');
  el.className = ok ? 'ok' : 'err';
  el.textContent = text;
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 登录成功回调：刷新登录信息区
SoysAuth.onLoginSuccess = function () { refreshMe(); };
refreshMe();
</script>
</body>
</html>
