<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服务器主页</title>
<style>
  :root {
    --primary: #4caf50;
    --primary-dark: #388e3c;
    --bg: #0f1419;
    --card: rgba(255,255,255,.06);
    --text: #e8edf2;
    --muted: #9aa7b4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
    line-height: 1.6;
  }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 18px 60px; }
  .hero {
    border-radius: 16px; overflow: hidden; position: relative;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    padding: 48px 28px; text-align: center;
    background-size: cover; background-position: center;
  }
  .hero::after { content:""; position:absolute; inset:0; background: rgba(0,0,0,.35); }
  .hero > * { position: relative; z-index: 1; }
  .hero h1 { font-size: 2rem; margin-bottom: 10px; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
  .hero .online {
    display: inline-block; margin-top: 14px; padding: 6px 16px;
    background: rgba(0,0,0,.35); border-radius: 999px; font-size: .9rem;
  }
  .hero .online b { color: #fff; }
  .card {
    background: var(--card); border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px; padding: 20px; margin-top: 18px;
  }
  .card h2 { font-size: 1.15rem; margin-bottom: 12px; color: var(--primary); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .btn {
    display: inline-block; padding: 10px 18px; border-radius: 10px; cursor: pointer;
    background: var(--primary); color: #fff; border: none; font-size: .95rem; font-weight: 600;
    transition: filter .15s;
  }
  .btn:hover { filter: brightness(1.08); text-decoration: none; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.ghost { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
  .muted { color: var(--muted); font-size: .85rem; }
  .copy-ip { font-family: ui-monospace, monospace; background: rgba(0,0,0,.3); padding: 4px 10px; border-radius: 8px; }
  ul.ann { list-style: none; }
  ul.ann li { padding: 6px 0; border-bottom: 1px dashed rgba(255,255,255,.08); }
  ul.ann li:last-child { border-bottom: none; }
  .gift-items { display: flex; flex-wrap: wrap; gap: 12px; margin: 14px 0; }
  .gift-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: rgba(0,0,0,.25); border-radius: 10px;
  }
  .gift-item img { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; background:#222; }
  .social { display: flex; flex-wrap: wrap; gap: 10px; }
  .social a { padding: 8px 14px; background: rgba(0,0,0,.25); border-radius: 10px; }
  .qrcode { max-width: 180px; border-radius: 10px; margin-top: 10px; }
  .footer { text-align: center; margin-top: 30px; color: var(--muted); font-size: .82rem; }
  .footer a { color: var(--muted); }
  .msg { margin-top: 10px; font-size: .9rem; min-height: 1.2em; }
  .msg.ok { color: #7ee08a; }
  .msg.err { color: #ff8a8a; }
  .hidden { display: none !important; }
  .loading { text-align: center; color: var(--muted); padding: 40px; }
</style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="loading" id="loading">正在加载主页配置…</div>
  </div>

  <script>
  (function () {
    "use strict";

    var CONFIG_URL = "/api/homepage/config";
    var LIVE_URL = "/api/homepage/live";
    var CLAIM_URL = "/api/homepage/gift/claim";

    var app = document.getElementById("app");
    var loading = document.getElementById("loading");

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    // 仅允许安全链接协议，防 XSS via 配置
    function safeUrl(s) {
      if (!s) return "";
      s = String(s);
      if (/^(https?:\/\/|mailto:|tel:|\/)/i.test(s)) return s;
      return "";
    }
    function el(tag, cls, html) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (html != null) e.innerHTML = html;
      return e;
    }
    function show(el) { if (el) el.classList.remove("hidden"); }
    function hide(el) { if (el) el.classList.add("hidden"); }

    function applyTheme(c) {
      var t = (c.theme && c.theme) || {};
      if (t["primary-color"]) {
        document.documentElement.style.setProperty("--primary", t["primary-color"]);
        document.documentElement.style.setProperty("--primary-dark", shade(t["primary-color"], -0.25));
      }
      var heroBg = c.page && c.page.background;
      if (!heroBg && t.carousel && t.carousel.length) heroBg = t.carousel[0];
      if (!heroBg && t["video-bg"]) heroBg = t["video-bg"];
      window.__heroBg = heroBg || "";
      if (t["custom-css"]) {
        var st = document.createElement("style");
        st.textContent = t["custom-css"];
        document.head.appendChild(st);
      }
      if (c.page && c.page.icon) {
        var link = document.createElement("link");
        link.rel = "icon"; link.href = c.page.icon;
        document.head.appendChild(link);
      }
      if (c.page && c.page.title) document.title = c.page.title;
      if (c.seo && c.seo.description) setMeta("description", c.seo.description);
      if (c.seo && c.seo.keywords) setMeta("keywords", c.seo.keywords);
    }
    function setMeta(name, content) {
      if (!content) return;
      var m = document.querySelector('meta[name="' + name + '"]');
      if (!m) { m = document.createElement("meta"); m.name = name; document.head.appendChild(m); }
      m.content = content;
    }
    function shade(hex, pct) {
      var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      if (!m) return hex;
      var r = parseInt(m[1], 16), g = parseInt(m[2], 16), b = parseInt(m[3], 16);
      r = Math.max(0, Math.min(255, Math.round(r + r * pct)));
      g = Math.max(0, Math.min(255, Math.round(g + g * pct)));
      b = Math.max(0, Math.min(255, Math.round(b + b * pct)));
      return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    function card(title) {
      var c = el("div", "card");
      if (title) c.appendChild(el("h2", null, esc(title)));
      return c;
    }

    function renderHero(c, live) {
      var hero = el("div", "hero");
      if (window.__heroBg) hero.style.backgroundImage = "linear-gradient(135deg, var(--primary), var(--primary-dark)), url('" + esc(window.__heroBg) + "')";
      hero.appendChild(el("h1", null, esc((c.page && c.page.title) || "我的世界服务器")));
      var liveWrap = (c.live && (c.live["show-online-count"] || c.live["show-status"]));
      if (liveWrap) {
        var o = el("div", "online");
        o.id = "onlineBadge";
        o.innerHTML = '<span id="onlineCount">—</span>';
        hero.appendChild(o);
      }
      app.appendChild(hero);
    }

    function renderServer(c) {
      var ui = c.ui || {};
      var s = c.server || {};
      if (!ui["show-text"] && !ui["show-buttons"] && !ui["show-download"] && !ui["show-intro"]) return;
      var cardEl = card("服务器信息");
      var rows = el("div");
      if (s.ip && (ui["show-text"] || ui["show-buttons"])) {
        var r1 = el("div", "row");
        r1.innerHTML = '<span class="copy-ip" id="ipText">' + esc(s.ip) + '</span>';
        var copyBtn = el("button", "btn ghost", "复制 IP");
        copyBtn.onclick = function () { copyText(s.ip); flash(copyBtn, "已复制", "复制失败"); };
        r1.appendChild(copyBtn);
        rows.appendChild(r1);
      }
      if (s.download && ui["show-download"]) {
        var dl = safeUrl(s.download);
        if (dl) rows.appendChild(el("div", "row", '<a class="btn" href="' + esc(dl) + '" target="_blank" rel="noopener">下载客户端</a>'));
      }
      if (s.intro && ui["show-intro"]) {
        rows.appendChild(el("p", "muted", esc(s.intro)));
      }
      cardEl.appendChild(rows);
      app.appendChild(cardEl);
    }

    function renderQQ(c) {
      var ui = c.ui || {};
      var q = c.qq || {};
      if (!ui["show-qq"]) return;
      if (!q["group-number"] && !q["group-link"] && !q["group-qrcode"]) return;
      var cardEl = card("QQ 群");
      var rows = el("div", "row");
      if (q["group-number"]) rows.appendChild(el("span", "muted", "群号：<b>" + esc(q["group-number"]) + "</b>"));
      var link = safeUrl(q["group-link"]);
      if (link) {
        var a = el("a", "btn ghost", "加入群聊");
        a.href = link; a.target = "_blank"; a.rel = "noopener";
        rows.appendChild(a);
      }
      cardEl.appendChild(rows);
      var qr = safeUrl(q["group-qrcode"]);
      if (qr) { var img = el("img", "qrcode"); img.src = qr; cardEl.appendChild(img); }
      app.appendChild(cardEl);
    }

    function renderSocial(c) {
      var soc = c.social || {};
      var links = [];
      if (soc.discord) links.push(["Discord", soc.discord]);
      if (soc.bilibili) links.push(["哔哩哔哩", soc.bilibili]);
      if (soc.weibo) links.push(["微博", soc.weibo]);
      if (soc["donate-link"]) links.push(["捐赠", soc["donate-link"]]);
      if (!links.length) return;
      var cardEl = card("关注我们");
      var box = el("div", "social");
      links.forEach(function (it) {
        var u = safeUrl(it[1]);
        if (u) {
          var a = el("a", null, esc(it[0]));
          a.href = u; a.target = "_blank"; a.rel = "noopener";
          box.appendChild(a);
        }
      });
      if (soc["donate-qrcode"]) {
        var dq = safeUrl(soc["donate-qrcode"]);
        if (dq) { var img = el("img", "qrcode"); img.src = dq; box.appendChild(img); }
      }
      cardEl.appendChild(box);
      app.appendChild(cardEl);
    }

    function renderAnnouncements(c) {
      var list = c.announcements || [];
      if (!list.length) return;
      var cardEl = card("公告");
      var ul = el("ul", "ann");
      list.forEach(function (t) { ul.appendChild(el("li", null, esc(t))); });
      cardEl.appendChild(ul);
      app.appendChild(cardEl);
    }

    function renderPartners(c) {
      var list = c.partners || [];
      if (!list.length) return;
      var cardEl = card("合作伙伴");
      var ul = el("ul", "ann");
      list.forEach(function (t) {
        if (typeof t === "string") ul.appendChild(el("li", null, esc(t)));
        else if (t && t.name) ul.appendChild(el("li", null, esc(t.name) + (t.url ? ' <a href="' + esc(safeUrl(t.url)) + '" target="_blank" rel="noopener">访问</a>' : "")));
      });
      cardEl.appendChild(ul);
      app.appendChild(cardEl);
    }

    function renderRules(c) {
      var rl = c["rules-link"];
      if (!rl) return;
      var u = safeUrl(rl);
      if (!u) return;
      var cardEl = card("服务器规则");
      var a = el("a", "btn ghost", "查看完整规则");
      a.href = u; a.target = "_blank"; a.rel = "noopener";
      cardEl.appendChild(a);
      app.appendChild(cardEl);
    }

    function renderGift(c) {
      var ui = c.ui || {};
      var g = c.gift || {};
      if (!ui["show-gift"] || !g.enabled || !g["show-button"]) return;
      var cardEl = card(g.title || "礼包");
      if (g.description) cardEl.appendChild(el("p", "muted", esc(g.description)));
      var items = g.items || [];
      if (items.length) {
        var box = el("div", "gift-items");
        items.forEach(function (it) {
          var gi = el("div", "gift-item");
          if (it.icon) { var img = el("img"); img.src = it.icon; gi.appendChild(img); }
          gi.appendChild(el("span", null, esc(it.name || "物品")));
          box.appendChild(gi);
        });
        cardEl.appendChild(box);
      }
      var btn = el("button", "btn", "领取礼包");
      btn.id = "claimBtn";
      var msg = el("div", "msg"); msg.id = "giftMsg";
      btn.onclick = function () { claimGift(btn, msg); };
      cardEl.appendChild(btn);
      cardEl.appendChild(msg);
      app.appendChild(cardEl);
    }

    function renderFooter(c) {
      var f = c.footer || {};
      var div = el("div", "footer");
      var html = "";
      if (f.copyright) html += esc(f.copyright);
      if (f.icp) html += ' &nbsp;·&nbsp; <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">' + esc(f.icp) + "</a>";
      div.innerHTML = html || "© " + new Date().getFullYear() + " Server";
      app.appendChild(div);
    }

    function copyText(txt) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(txt).then(function(){return true;}).catch(function(){return fallbackCopy(txt);});
      }
      return Promise.resolve(fallbackCopy(txt));
    }
    function fallbackCopy(txt) {
      try {
        var ta = document.createElement("textarea"); ta.value = txt;
        document.body.appendChild(ta); ta.select(); document.execCommand("copy");
        document.body.removeChild(ta); return true;
      } catch (e) { return false; }
    }
    function flash(btn, okTxt, errTxt) {
      var old = btn.textContent;
      copyText(window.__ip || "").then(function (ok) {
        btn.textContent = ok ? okTxt : errTxt;
        setTimeout(function(){ btn.textContent = old; }, 1500);
      });
    }

    function claimGift(btn, msg) {
      btn.disabled = true;
      msg.className = "msg"; msg.textContent = "领取中…";
      fetch(CLAIM_URL, { method: "POST", credentials: "include" })
        .then(function (r) { return r.json().then(function (j) { return { status: r.status, j: j }; }); })
        .then(function (res) {
          var j = res.j || {};
          var code = (j.code != null) ? j.code : res.status;
          if (code === 200) {
            msg.className = "msg ok"; msg.textContent = (j.msg || "领取成功！") + " 请查收游戏内物品。";
          } else if (code === 401) {
            msg.className = "msg err"; msg.textContent = "请先进入游戏并登录后再领取礼包。";
            btn.disabled = false;
          } else if (code === 403) {
            msg.className = "msg err"; msg.textContent = j.msg || "无权领取。";
            btn.disabled = false;
          } else {
            msg.className = "msg err"; msg.textContent = j.msg || ("领取失败（" + code + "）");
            btn.disabled = false;
          }
        })
        .catch(function (e) {
          msg.className = "msg err"; msg.textContent = "网络错误：" + e.message;
          btn.disabled = false;
        });
    }

    function pollLive(c) {
      var lv = c.live || {};
      if (!lv["show-online-count"] && !lv["show-status"]) return;
      var sec = Math.max(5, lv["cache-seconds"] || 0);
      if (sec === 0) sec = 30; // 未配置则默认 30s
      function tick() {
        fetch(LIVE_URL, { credentials: "include" })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            if (j.code !== 200 || !j.data) return;
            var d = j.data;
            var badge = document.getElementById("onlineBadge");
            if (badge) {
              var txt = "在线 <b>" + esc(d.online) + "</b>";
              if (d.max != null) txt += " / " + esc(d.max);
              badge.innerHTML = txt;
            }
          })
          .catch(function () {});
      }
      tick();
      setInterval(tick, sec * 1000);
    }

    function render(cfg) {
      applyTheme(cfg);
      renderHero(cfg);
      renderServer(cfg);
      renderQQ(cfg);
      renderSocial(cfg);
      renderAnnouncements(cfg);
      renderPartners(cfg);
      renderRules(cfg);
      renderGift(cfg);
      renderFooter(cfg);
      pollLive(cfg);
    }

    function boot() {
      fetch(CONFIG_URL, { credentials: "include" })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j.code !== 200 || !j.data) {
            loading.textContent = "主页配置加载失败：" + (j.msg || "未知错误");
            return;
          }
          window.__ip = (j.data.server && j.data.server.ip) || "";
          loading.remove();
          render(j.data);
        })
        .catch(function (e) {
          loading.textContent = "主页配置加载失败：" + e.message;
        });
    }

    boot();
  })();
  </script>
</body>
</html>
