# 会话令牌颁发器（CredentialIssuer 参考实现，演示接入模式；未来登录插件参照实现自己的颁发器）
# 启用后：/soyshttp key <subject> 下发会话令牌（同一 token 可作 X-API-Key / Bearer / Cookie 使用），
# auth 策略会自动用它校验 Bearer / X-API-Key / Cookie(soys_session) 三种来源。
# 注：令牌为内存态，服务重启后全部失效。
enabled: true
cookie-name: soys_session
ttl-seconds: 86400
# 跨服时钟容差（秒）：校验 exp/iat 时容忍各子服时钟偏移（默认 30s），
# 防 NTP 未对齐导致误拒；超过容差的未来签发时间视为无效。
clock-skew-seconds: 30
