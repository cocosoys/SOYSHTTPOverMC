# ============ 安全网关总开关（独立于主 config.yml）============
# 网关配置采用独立目录布局：
#   gateway/config.yml           总开关（本文件）
#   gateway/https.yml            HTTPS 设置（25564 就地升级）
#   gateway/policies/<name>.yml  每个安全策略一个文件，文件名即策略名
#   gateway/issuers/<name>.yml   每个凭证颁发器一个文件（登录插件接入）
# 修改后执行 /soyshttp reload 热重载，无需重启服务器。
enabled: true
# 注解式 API 全局前缀：始终生效（与 auth 是否启用无关），@GetMapping("/ping") 一律映射为 /api/ping。
# 这样 API 地址恒定，避免「未开启 auth 时 API 地址变化」带来的配置不一致问题。
# 在 auth.yml 的 paths/exempt 中写逻辑路径（如 /ping）即可，网关会自动补 /api 前缀后再匹配，
#（也兼容显式写 /api/ping）。修改需重启服务器（/soyshttp reload 不重注册路由）。
api-prefix: /api
# 事件调试：true 时在控制台打印网关事件（请求进入/拒绝/完成/凭证下发/API注册/API卸载），便于排查
debug-events: false
