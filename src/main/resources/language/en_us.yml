command.key.detail: "/soyshttp key <subject> —— issue a highest-permission credential (admin key, ak_ prefix) for the given subject.\n  <subject>   subject identifier (usually a player name or external service name).\nWhen the session token issuer is enabled, the issued ak_ key carries the adm flag, the permission layer lets it through\ndirectly, allowing access to all APIs without permission (for trusted external services only, keep it secret); other issuers\nissue it as a normal credential (without highest permission).\nTab completes online player names; only op can execute."
