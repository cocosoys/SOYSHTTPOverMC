# ============ SOYSHTTPOverMC 中文语言包 ============
# 统一平铺点路径键（加载时经 YamlConfiguration.getKeys(true) 平铺进内存 Map）。
# 业务代码通过 I18n.t("键", "兜底文本", 参数...) 读取，键缺失时回退到代码内兜底文本。
# 占位符用 {0} {1} ...（I18n.format 用 String.replace("{i}", 实参) 替换）。
# 语言文件存放在 插件配置目录/language/ 文件夹下，文件名即语言代码（当前实现中文 zh_cn）。
# 如需自定义，请编辑 服务器目录/plugins/SOYSHTTPOverMC/language/zh_cn.yml，重启或 /soyshttp reload 生效。

