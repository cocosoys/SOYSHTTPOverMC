# ============ HTTP-Over-MC (同端口嗅探版) ============
# 核心：访问端口 == 服务器端口（Spigot 的 server-port）。
# 插件在 Spigot 自己的监听 socket 上嗅探 HTTP 流量并就地转换，
# MC 流量原样放行，玩家与 curl 共用同一个端口。

# 虚拟 Bot 身份（服务端与 Bot 必须一致，用于识别隧道消息来源）
bot:
  username: __http_proxy__

# 插件消息通道（服务端与 Bot 必须一致）
channel: httpproxy:main

# 无头 Bot 回连本服的地址与端口。
# 必须 == Spigot 的 server-port 所监听的端口（即"服务器端口"）。
# server.properties 的 server-port 即对外端口（如 25564，可按需自定义），无需另配端口、无需挪窝。
# host 留空（默认）则自动取 server.properties 的 server-ip（为空再回退 127.0.0.1）；
# port 留 0（默认）则自动取 server.properties 的 server-port（再回退运行期端口）。
# 已显式填写的值优先；未填写则自动解析（host→server-ip→127.0.0.1；port→server-port→运行期端口）。
mc:
  host: ""
  port: 0
  # 群组服（BungeeCord / Waterfall / Velocity）下对外公布的「公网地址」覆盖：
  # 留空则沿用上面的 host/port（解析 server.properties）。
  # 当后端端口需经代理对外、或后端绑定内网而客户端应连代理公网地址时，
  # 在此填客户端实际可达的 host/port（例如代理公网 IP 与后端端口，或后端自身公网 IP 与 server-port）。
  # 仅影响对外连接信息（/soyshttp send 链接、状态页显示的地址），
  # 不改变无头 Bot 回连本服的地址（Bot 始终回连后端 server-port）。
  public-host: ""
  public-port: 0
  # 是否信任前置代理（SOYSHTTPOverMC 的 BungeeCord 代理模块）注入的 X-Forwarded-For，
  # 以恢复真实访客 IP（用于限流/白名单/审计）。本插件代理模块在反向代理时会注入该头；
  # 仅当后端确在可信代理之后时保持 true。若后端可被客户端直连（未经代理），建议设 false 防伪造。
  trust-proxy: true

# 群组服（BungeeCord / Waterfall / Velocity）配置：
# server-name 为该子服在代理中的唯一名称（对应 BungeeCord config.yml servers.<name>）。
# 仅在群组服下填写；独立服留空。用于：①跨服请求路由（/server/<server-name>/...，兼容旧写法 /srv/<server-name>/...）；
# ②Bot 携带服务器标签（名称/host/port）经 discovery 广播，便于网关与其他插件定位并与 Bot 通讯。
# 注意：群组服下每台子服的 server-name 必须唯一且与该服在代理里注册的名字一致。
# proxy-address 为 Bot 经代理连接的地址（host:port，即 BungeeCord / Velocity 监听端口）。
# 群组服下必须填写：Bot 只有“经代理连接的玩家”身份，其 BungeeCord 频道 Forward 才会被代理跨服中继；
# 留空则 Bot 直连后端，Forward 被静默丢弃 → 跨服请求/发现全部失效。通常填 127.0.0.1:<代理端口>。
proxy:
  server-name: ""
  proxy-address: ""

# 同端口 HTTP 嗅探器
sniffer:
  # 是否在 Spigot 自身监听端口上嗅探 HTTP（true=访问端口==服务器端口）
  enabled: true
  # HTTP 请求体上限（字节），超过返回 413
  max-body-bytes: 8388608

# 前端资源目录（可选）
# - 留空（默认）：插件首次运行会把 jar 内置的 /web/* 解压到插件数据目录的 web/ 文件夹
#   （即 plugins/SOYSHTTPOverMC/web/），并直接以该磁盘目录为前端根目录。
#   此后可直接编辑磁盘上的文件（index.html / news/ / status/ 等），刷新浏览器即生效，无需重构建；
#   已存在的文件不会被覆盖（保留你的修改），仅补回缺失的内置默认资源；磁盘缺失的文件回退 jar 内置。
# - 指定路径：优先从该目录读取静态文件（相对数据目录或绝对路径）。
# 支持路径：/、/index.html、/app.js、/styles.css、/api/status(动态JSON) 等。
web:
  root: "/web"

# ============ 日志管控 ============
# 统一日志门面 LogKit 的打印级别（全插件日志经此过滤）：
#   OFF    - 关闭所有输出
#   ERROR  - 仅严重错误
#   WARN   - 错误 + 警告
#   INFO   - 以上 + 常规运行信息（默认）
#   DEBUG  - 以上 + 调试明细（策略明细、请求跟踪等）
#   TRACE  - 以上 + 最细粒度追踪
# 修改后 /soyshttp reload 热重载，无需重启服务器。
log:
  level: INFO

# ============ 安全网关 ============
# 网关配置已独立到 gateway/ 目录（总开关 gateway/config.yml、HTTPS gateway/https.yml、
# 各安全策略 gateway/policies/<name>.yml，每个策略一个文件，便于未来扩展更多策略）。
# 修改后 /soyshttp reload 热重载，无需重启服务器。

# ============ 网页登录（登录插件 SPI）============
# 指定使用的登录插件提供者（LoginProvider 的 name，如 authme）。
# 留空 = 自动选用第一个已加载的可用登录插件。
auth:
  login-provider: ""
