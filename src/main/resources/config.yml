# ============ HTTP-Over-MC (同端口嗅探版) ============
# 核心：访问端口 == 服务器端口（Spigot 的 server-port）。
# 插件在 Spigot 自己的监听 socket 上嗅探 HTTP 流量并就地转换，
# MC 流量原样放行，玩家与 curl 共用同一个端口。

# 虚拟 Bot 身份（服务端与 Bot 必须一致，用于识别隧道消息来源）
bot:
  username: __http_proxy__
  # Bot 专属账号名称前缀（默认为 "__bot__"）。
  # ⚠️ 不建议修改：所有以该前缀开头的账号一律视为 bot 专属账号，受以下保护：
  #    ① 登录 IP 白名单限制（见 allowed-login-ips），非白名单 IP 使用此类账号登录将被拒绝并提示；
  #    ② 进服后自动对真实玩家隐藏（见 hide-mode）。
  # 仅在确与现有账号冲突等极端情况下才可修改，且需保证 bot.username / API 注册的 bot 名与之匹配。
  name-prefix: "__bot__"
  # Bot 允许登录的 IP 白名单（Bot 回环登录本服时来源为 127.0.0.1 / ::1）。
  # 其余 IP 使用 bot 专属账号（前缀或受管 bot 名）登录将被强制拒绝，提示"该账号为 bot 专属账号"，
  # 用于防止 Bot 被特殊方式强制踢出后，有人抢注其名称登录。
  # 支持多个 IP；回环地址（127.0.0.1 / ::1 / localhost）等价匹配。
  allowed-login-ips:
    - "127.0.0.1"
  # Bot 对真实玩家的隐藏方式：
  #   hideplayer          = 在 PlayerJoinEvent 中对每个真实玩家调用 hidePlayer(botPlayer)，新进服玩家同样隐藏（当前实现）
  #   playerinfo-remove   = 向所有客户端发送 PacketPlayOutPlayerInfo(REMOVE_PLAYER)（预留：当前为占位空实现，切换后不生效）
  hide-mode: "hideplayer"
  # 自动重连次数：Bot 连不上或被踢出后自动重连的尝试次数（0=禁用自动重连；默认 3）。
  # 达到上限仍未成功则放弃，需人工执行 /soyshttp reconnect 恢复。
  reconnect-attempts: 3

# 插件消息通道（服务端与 Bot 必须一致）
channel: httpproxy:main

# 无头 Bot 回连本服的地址与端口。
# 必须 == Spigot 的 server-port 所监听的端口（即"服务器端口"）。
# server.properties 的 server-port 即对外端口（如 25564，可按需自定义），无需另配端口、无需挪窝。
# host 留空（默认）则自动取 server.properties 的 server-ip（为空再回退 127.0.0.1）；
# port 留 0（默认）则自动取 server.properties 的 server-port（再回退运行期端口）。
# 已显式填写的值优先；未填写则自动解析（host→server-ip→127.0.0.1；port→server-port→运行期端口）。
mc:
  host: ""
  port: 0
  # 群组服（BungeeCord / Waterfall / Velocity）下对外公布的「公网地址」覆盖：
  # 留空则沿用上面的 host/port（解析 server.properties）。
  # 当后端端口需经代理对外、或后端绑定内网而客户端应连代理公网地址时，
  # 在此填客户端实际可达的 host/port（例如代理公网 IP 与后端端口，或后端自身公网 IP 与 server-port）。
  # 仅影响对外连接信息（/soyshttp send 链接、状态页显示的地址），
  # 不改变无头 Bot 回连本服的地址（Bot 始终回连后端 server-port）。
  public-host: ""
  public-port: 0
  # 是否信任前置代理（SOYSHTTPOverMC 的 BungeeCord 代理模块）注入的 X-Forwarded-For，
  # 以恢复真实访客 IP（用于限流/白名单/审计）。本插件代理模块在反向代理时会注入该头；
  # 仅当后端确在可信代理之后时保持 true。若后端可被客户端直连（未经代理），建议设 false 防伪造。
  trust-proxy: true

# 群组服（BungeeCord / Waterfall / Velocity）配置：
# server-name 为该子服在代理中的唯一名称（对应 BungeeCord config.yml servers.<name>）。
# 仅在群组服下填写；独立服留空。用于：①跨服请求路由（/server/<server-name>/...，兼容旧写法 /srv/<server-name>/...）；
# ②Bot 携带服务器标签（名称/host/port）经 discovery 广播，便于网关与其他插件定位并与 Bot 通讯。
# 注意：群组服下每台子服的 server-name 必须唯一且与该服在代理里注册的名字一致。
# proxy-address 为 Bot 经代理连接的地址（host:port，即 BungeeCord / Velocity 监听端口）。
# 群组服下必须填写：Bot 只有“经代理连接的玩家”身份，其 BungeeCord 频道 Forward 才会被代理跨服中继；
# 留空则 Bot 直连后端，Forward 被静默丢弃 → 跨服请求/发现全部失效。通常填 127.0.0.1:<代理端口>。
proxy:
  server-name: ""
  proxy-address: ""

# 同端口 HTTP 嗅探器
sniffer:
  # 是否在 Spigot 自身监听端口上嗅探 HTTP（true=访问端口==服务器端口）
  enabled: true
  # HTTP 请求体上限（字节），超过返回 413
  max-body-bytes: 8388608
  # 秒杀/高并发防护：
  # 同时阻塞在隧道等待（future.get）的请求数上限（默认 4）。每个请求在经 Bot 隧道往返期间
  # 占用一个 worker；达到该值且队列满后，新请求直接 503 快速失败，直到有空位（不再堆积）。
  # 日常负载可适当调大（如 4~8），需权衡单 Bot 隧道吞吐。
  http-concurrency: 4
  # 等待中的请求队列容量（满后新请求直接 503）
  http-queue-size: 8

# 前端资源目录（可选）
# - 留空（默认）：插件首次运行会把 jar 内置的 /dist/* 解压到插件数据目录的 web/ 文件夹
#   （即 plugins/SOYSHTTPOverMC/web/），并直接以该磁盘目录为前端根目录。
#   此后可直接编辑磁盘上的文件（index.html / news/ / status/ 等），刷新浏览器即生效，无需重构建；
#   已存在的文件不会被覆盖（保留你的修改），仅补回缺失的内置默认资源；磁盘缺失的文件回退 jar 内置。
# - 指定路径：优先从该目录读取静态文件（相对数据目录或绝对路径）。
# 支持路径：/、/index.html、/app.js、/styles.css、/api/status(动态JSON) 等。
web:
  root: "/dist"
  # ===== Web 内容存活缓存（缓解大量 web 资源长期驻留内存）=====
  # 仅对「惰性来源」生效（磁盘文件 / jar 资源，请求时读取）；registerPage 直接给定的字节不受控。
  cache:
    # LRU 缓存字节上限（默认 16MB）。仅约束「非常驻」文件；常驻（pinned）不计入此配额。
    max-bytes: 16777216
    # LRU 缓存条目数上限
    max-entries: 1024
    # 条目存活时间（秒）：超过后若无人再次访问即失效释放（下次访问重新加载）
    ttl-seconds: 60
    # 常驻内存清单：路径精确匹配或目录前缀（以 / 结尾）匹配。命中项直接进常驻内存，
    # 不参与淘汰、不占用 max-bytes（用于必须高频/快速响应的资源，如门户首页）。
    # 例：["/", "/assets/"]（"/" 精确匹配门户首页；"/assets/" 前缀匹配整个目录）
    pinned: [
      "/", 
      "/assets/"
    ]
  # 大文件判定阈值（字节）：超过该大小的磁盘文件视为大文件——不写入缓存，
  # 交由「大文件加载抽象」处理（默认内置流式分块加载器；默认阈值 = cache.max-bytes）。
  large-file-threshold: 16777216
  # 大文件安全上限（字节）：超过直接拒绝加载（防单文件打爆内存，默认 128MB）
  large-file-max-bytes: 134217728

# ============ 日志管控 ============
# 统一日志门面 LogKit 的打印级别（全插件日志经此过滤）：
#   OFF    - 关闭所有输出
#   ERROR  - 仅严重错误
#   WARN   - 错误 + 警告
#   INFO   - 以上 + 常规运行信息（默认）
#   DEBUG  - 以上 + 调试明细（策略明细、请求跟踪等）
#   TRACE  - 以上 + 最细粒度追踪
# 修改后 /soyshttp reload 热重载，无需重启服务器。
log:
  level: INFO

# ============================================================================
#  数据存储（多后端，照抄 SOYSOceanBox 架构）
# ----------------------------------------------------------------------------
#  【多后端】
#  三种后端可同时开启。优先级固定为: MYSQL > SQLITE > YAML
#  已启用的后端中优先级最高者为「主存储」，负责所有读操作；
#  其余启用的后端作为「辅助存储」，写入时被镜像同步，充当热备份。
#  例: 同时开启 mysql 与 yaml -> MySQL 为主库，yaml 自动保持一份可读的本地副本。
#
#  【互转与覆盖】
#  使用 /soyshttp migrate <来源> <目标> 在任意两个后端之间转换数据，
#  使用 /soyshttp sync 将主存储的全量数据覆盖写入所有辅助存储。
# ============================================================================
storage:

  backends:

    # ---------- YAML（默认启用，零依赖） ----------
    yaml:
      enabled: true
      file: data/records.yml
      backup-on-save: false

    # ---------- SQLite（默认禁用） ----------
    sqlite:
      enabled: false
      file: data/records.db
      table-prefix: 'mc_shttp_'

    # ---------- MySQL（默认禁用，启用后自动成为主存储） ----------
    mysql:
      enabled: false
      url: 'jdbc:mysql://localhost:3306/minecraft?useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai'
      username: root
      password: ''
      table-prefix: 'mc_shttp_'
      keepalive-interval: 1800

  # --------------------------------------------------------------
  #  跨服数据同步
  # --------------------------------------------------------------
  #  开启后，多个服务端实例共享同一份跨服同步数据（令牌黑名单/审计/心跳/全局密钥）。
  #  前提：所有实例的 storage.backends.mysql.enabled 必须设为 true 且指向同一数据库，
  #  此时 MySQL 自动成为「主存储」，数据跨服可见。
  #  注意：实例各自仍可将本地 yaml/sqlite 作为热备份（辅助存储），但请勿在
  #  多实例间互相同步（sync 命令 / sync-on-startup），以免覆盖共享数据。
  cross-server: false

  # --------------------------------------------------------------
  #  辅助存储镜像写入
  # --------------------------------------------------------------
  mirror:
    enabled: true
    async: true
    sync-on-startup: false
