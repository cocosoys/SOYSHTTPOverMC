# ============================================================================
#  数据贡献 (upload)
# ----------------------------------------------------------------------------
# 是否同意将当前服务器的公网地址（IP:端口，如 127.0.0.1:25564）匿名贡献给
# cocosoys 的数据服务器，仅用于让 cocosoys 进行数据统计（如插件用量、地域分布）。
# 我们承诺：该地址仅用于统计，不会暴露给任何第三方或个人。
# 本质为向 upload.server 发送一个 POST 请求，请求体只携带 IP 与端口。
upload:
  enabled: false
  server: "https://api.cocosoys.com/report"


# ============================================================================
#  插件消息通道
# ----------------------------------------------------------------------------
channel: httpproxy:main


# ============================================================================
#  MC 服务器地址与端口。
# ----------------------------------------------------------------------------
# 必须 == Spigot 的 server-port 所监听的端口（即"服务器端口"）。
# server.properties 的 server-port 即对外端口（如 25564，可按需自定义），无需另配端口、无需挪窝。
# host 留空（默认）则自动取 server.properties 的 server-ip（为空再回退 127.0.0.1）；
# port 留 0（默认）则自动取 server.properties 的 server-port（再回退运行期端口）。
# 已显式填写的值优先；未填写则自动解析（host→server-ip→127.0.0.1；port→server-port→运行期端口）。
mc:
  host: ""
  port: 0
  # 群组服（BungeeCord / Waterfall / Velocity）下对外公布的「公网地址」覆盖：
  # 留空则沿用上面的 host/port（解析 server.properties）。
  # 当后端端口需经代理对外、或后端绑定内网而客户端应连代理公网地址时，
  # 在此填客户端实际可达的 host/port（例如代理公网 IP 与后端端口，或后端自身公网 IP 与 server-port）。
  # 仅影响对外连接信息（/soyshttp send 链接、状态页显示的地址），
  # 不改变 HTTP 后端连接本服的地址。
  public-host: ""
  public-port: 0
  # 是否信任前置代理（SOYSHTTPOverMC 的 BungeeCord 代理模块）注入的 X-Forwarded-For，
  # 以恢复真实访客 IP（用于限流/白名单/审计）。本插件代理模块在反向代理时会注入该头；
  # 仅当后端确在可信代理之后时保持 true。若后端可被客户端直连（未经代理），建议设 false 防伪造。
  trust-proxy: true


# ============================================================================
#  群组服（BungeeCord / Waterfall / Velocity）配置
# ----------------------------------------------------------------------------
# server-name 为该子服在代理中的唯一名称（对应 BungeeCord config.yml servers.<name>）。
# 仅在群组服下填写；独立服留空。用于：①跨服请求路由（/server/<server-name>/...）；
# ②携带服务器标签（名称/host/port）经 discovery 广播，便于网关与其他插件定位目标服。
# 注意：群组服下每台子服的 server-name 必须唯一且与该服在代理里注册的名字一致。
# proxy-address 为经代理连接的地址（host:port，即 BungeeCord / Velocity 监听端口）。
# 群组服下必须填写：只有"经代理连接"的身份，其 BungeeCord 频道 Forward 才会被代理跨服中继；
# 留空则直连后端，Forward 被静默丢弃 → 跨服请求/发现全部失效。通常填 127.0.0.1:<代理端口>。
proxy:
  server-name: ""
  proxy-address: ""


# ============================================================================
#  同端口 HTTP 嗅探器
# ----------------------------------------------------------------------------
# 核心：访问端口 == 服务器端口（Spigot 的 server-port）。
# 插件在 Spigot 自己的监听 socket 上嗅探 HTTP 流量并就地转换，
# MC 流量原样放行，玩家与 curl 共用同一个端口。
sniffer:
  # 是否在 Spigot 自身监听端口上嗅探 HTTP（true=访问端口==服务器端口）
  enabled: true
  # HTTP 请求体上限（字节），超过返回 413
  max-body-bytes: 8388608
  # 秒杀/高并发防护：
  # 同时阻塞在 HTTP 后端等待（future.get）的请求数上限（默认 4）。每个请求在经 HTTP 后端处理期间
  # 占用一个 worker；达到该值且队列满后，新请求直接 503 快速失败，直到有空位（不再堆积）。
  # 日常负载可适当调大（如 4~8），需权衡单连接吞吐。
  http-concurrency: 4
  # 等待中的请求队列容量（满后新请求直接 503）
  http-queue-size: 8
  # HTTP keep-alive 空闲超时（秒，默认 30）：响应写完且未收到下一个请求时，空闲 N 秒后关闭连接，
  # 避免长连接泄漏。适当调大（如 60~120）可减少连接断开重建频率：
  #   ① 减少 Chrome 对自签证书场景下新建连接的重校验（certificate_unknown 警告）；
  #   ② 提升长轮询/SSE 等长连接稳定性。代价是空闲连接占用更多 socket 资源。
  keep-alive-idle-seconds: 120


# ============================================================================
#  HTTP 后端传输模式
# ----------------------------------------------------------------------------
# 控制 HTTP 请求从网关层到业务处理层（WebFrontendHandler）的传输方式。
# 四种模式可选，默认 netty-eventloop（延迟低且不阻塞 IO 线程）：
#
#   direct            - 直接调用：在 Netty IO 线程直接调用 WebFrontendHandler，
#                       延迟最低（<1ms），但高并发下会阻塞 IO 线程影响其他连接。
#   netty-eventloop   - Netty EventLoop（默认，推荐）：提交到独立 Netty EventLoop 处理，
#                       延迟低（~1-3ms），不阻塞网关 IO 线程。
#   memory-queue      - 内存队列：提交到有界 ArrayBlockingQueue，worker 线程处理，
#                       支持背压（队列满返回 503），延迟略高（~2-5ms）。
#   standalone-server - 独立 HTTP 服务器：在独立端口启动 Netty HTTP 服务器，
#                       不使用同端口嗅探，延迟最低（<1ms），实现最简单可靠。
#                       需配置下方 standalone-server.host / port。
#
# 配置结构：每种模式的参数放在 http-backend.<mode> 下（如 http-backend.netty-eventloop.threads）。
# 旧的扁平配置（如 http-backend.netty-threads）仍向后兼容，但推荐使用新的分层结构。
http-backend:
  # 传输模式：direct / netty-eventloop / memory-queue / standalone-server
  mode: "netty-eventloop"

  # direct 模式：无额外参数
  direct: {}

  # netty-eventloop 模式配置
  netty-eventloop:
    # 处理请求的 EventLoop 线程数（默认 2）
    threads: 2

  # memory-queue 模式配置
  memory-queue:
    # 任务队列容量（默认 1024，满则返回 503）
    capacity: 1024
    # worker 线程数（默认 4）
    workers: 4

  # standalone-server 模式配置（独立端口 HTTP 服务器，不占用 MC 端口）
  standalone-server:
    # 监听地址（0.0.0.0 = 所有网卡，127.0.0.1 = 仅本地）
    host: "0.0.0.0"
    # 监听端口（默认 25565，需与 MC 端口不同）
    port: 25565


# ======================================================================================
#  日志管控
# ----------------------------------------------------------------------------
# 统一日志门面 LogKit 的打印级别（全插件日志经此过滤）：
#   OFF    - 关闭所有输出
#   ERROR  - 仅严重错误
#   WARN   - 错误 + 警告
#   INFO   - 以上 + 常规运行信息（默认）
#   DEBUG  - 以上 + 调试明细（策略明细、请求跟踪等）
#   TRACE  - 以上 + 最细粒度追踪
# 修改后 /soyshttp reload 热重载，无需重启服务器。
log:
  level: INFO


# ============================================================================
#  数据存储（多后端）
# ----------------------------------------------------------------------------
#  【多后端】
#  三种后端可同时开启。优先级固定为: MYSQL > SQLITE > YAML
#  已启用的后端中优先级最高者为「主存储」，负责所有读操作；
#  其余启用的后端作为「辅助存储」，写入时被镜像同步，充当热备份。
#  例: 同时开启 mysql 与 yaml -> MySQL 为主库，yaml 自动保持一份可读的本地副本。
#
#  【互转与覆盖】
#  使用 /soyshttp migrate <来源> <目标> 在任意两个后端之间转换数据，
#  使用 /soyshttp sync 将主存储的全量数据覆盖写入所有辅助存储。
# ============================================================================
storage:

  backends:

    # ---------- YAML（默认启用，零依赖） ----------
    yaml:
      enabled: true
      # file 指定【存放各类 yml 表的文件夹】（不是单个文件）：
      #   KV 记录写入 <file>/records.yml；ORM 各实体写入 <file>/<表名>.yml。
      #   兼容旧式写法 file: data/records.yml（取其父目录 data/ 作为文件夹）。
      file: data/
      backup-on-save: false

    # ---------- SQLite（默认禁用） ----------
    sqlite:
      enabled: false
      file: data/records.db
      # 创建表的前缀，若无特殊要求请勿修改，避免开发者无法获取到正确的表名称
      table-prefix: ''

    # ---------- MySQL（默认禁用，启用后自动成为主存储） ----------
    mysql:
      enabled: false
      url: 'jdbc:mysql://localhost:3306/minecraft?useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai'
      username: root
      password: ''
      # 创建表的前缀，若无特殊要求请勿修改，避免开发者无法获取到正确的表名称
      table-prefix: ''
      keepalive-interval: 1800

  # --------------------------------------------------------------
  #  跨服数据同步
  # --------------------------------------------------------------
  #  开启后，多个服务端实例共享同一份跨服同步数据（令牌黑名单/审计/心跳/全局密钥）。
  #  前提：所有实例的 storage.backends.mysql.enabled 必须设为 true 且指向同一数据库，
  #  此时 MySQL 自动成为「主存储」，数据跨服可见。
  #  注意：实例各自仍可将本地 yaml/sqlite 作为热备份（辅助存储），但请勿在
  #  多实例间互相同步（sync 命令 / sync-on-startup），以免覆盖共享数据。
  cross-server: false

  # --------------------------------------------------------------
  #  辅助存储镜像写入
  # --------------------------------------------------------------
  mirror:
    enabled: true
    async: true
    sync-on-startup: false

