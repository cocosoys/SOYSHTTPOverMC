# 统一凭证鉴权策略（order 20）：支持三种凭证来源 + 可插拔颁发器，按路径保护。
# 1) X-API-Key 头（header 可配，默认 X-API-Key）：值经 SHA-256 哈希匹配本地表
#    soys_api_key（由 /soyshttp apikey 管理；auth.yml keys 静态源已迁移至该表）；
# 2) Authorization：Bearer <key>（哈希匹配本地表）或 Basic（用户名=key）；
# 3) Cookie：请求携带的 cookie 交由 gateway/issuers/ 下启用的颁发器校验（如 session-token）。
# 本地表 key 与任一启用颁发器匹配即放行，全部不匹配 → 401。
enabled: true
header: X-API-Key
# 网页登录使用的登录插件提供者（LoginProvider 的 name，如 authme；留空=自动选用第一个已加载的可用登录插件）。
# 若未接入任何登录插件，网页登录自动切换为「免密码」模式：仅需输入用户名即可签发会话令牌（见 AuthLoginBridge）。
login-provider: ""
# keys 静态源已迁移至本地表 soys_api_key（/soyshttp apikey 管理）；此处不再读取。
paths: [/api/*]          # 空=保护所有路径；* 全匹配；/api/* 前缀匹配。
exempt: [/ping, /whoami, /auth/login, /auth/issue, /auth/mode, /auth/status, /homepage/config, /homepage/live]  # 豁免路径（公开端点）：命中则跳过鉴权直接放行。/ping 为存活检测；/auth/login 为登录窗口登录接口（登录前无凭证）；/auth/issue 为票据/免密登录提交；/auth/mode 为前端登录页模式探测；/auth/status 为登录状态检查（未登录时调用，支持游戏端IP匹配自动登录）；/homepage/* 为主页公开配置/实时数据；logout/me 仍需凭证。
accept:
  header: true           # 接受 X-API-Key 头
  bearer: true           # 接受 Authorization: Bearer
  basic: true            # 接受 Authorization: Basic（用户名=key）
  cookie: true           # 接受 Cookie（值由启用的颁发器校验）

# 自动登录（记住我 / IP 匹配 / 设备指纹双因子）：
#   auto.login.ttl.enable      — 记住我（设备免登录）总开关：true=启用（默认），登录时按前端“记住我”
#                                 勾选签发长期设备凭证 Cookie（soys_remember，HttpOnly），后续访问
#                                 /api/auth/status 自动登录，无需重新输密码；false=关闭（不签发、不验证）。
#   auto.login.ttl.activetime  — 记住我凭证有效期（天，默认 7），由服务器管理员设置。
#   auto.login.ip.enabled      — 旧“IP 匹配免登录”开关：false=关闭（默认，不再按“游戏在线+网页IP==游戏IP”
#                                 自动登录，IP 无法精准到个人设备，同 NAT 下会误伤他人）；true=保留旧行为
#                                 （仅建议局域网/单机环境开启）。
#   auto.login.fp.enable       — 设备指纹双因子开关：false=关闭（默认，仅凭记住我 Cookie，行为不变）；
#                                 true=开启：自动登录时除校验 soys_remember 凭证外，还校验请求携带的
#                                 X-Device-Fingerprint 与设备绑定表（soys_device_binding）一致，
#                                 防“记住我 Cookie 被搬到其他设备”。指纹仅存哈希、非秘密凭据。
#   auto.login.fp.strict       — 指纹严格模式：true=严格（默认，指纹不一致/未携带 → 拒绝自动登录，
#                                 前端引导“重新登录 / 游戏内票据绑定”）；false=宽松（不一致仅告警放行）。
#                                 存量用户迁移：开启后无绑定记录的设备自动登录时会放行一次并要求前端立即补绑。
#   auto.login.ticket.ttl      — 游戏端→网页端绑定票据有效期（秒，默认 60）：玩家游戏内登录后聊天栏
#                                 出现一次性链接，浏览器打开后提交“票据+设备指纹”完成设备绑定并签发记住我凭证。
#   auto.login.ticket.in-game-link — 游戏内登录后是否发送可点击票据链接（默认 true=发送）。
auto:
  login:
    ttl:
      enable: true
      activetime: 7
    ip:
      enabled: false
    fp:
      enable: false
      strict: true
    ticket:
      ttl: 60
      in-game-link: true

# X-API-Key 权限降级开关：
#   api-key.local-fallback-all — false=关闭（默认，安全优先）：本地权限表（local）不可用时，
#                                 X-API-Key 按无权限拒绝（403）；true=开启：local 不可用时
#                                 X-API-Key 退化为拥有所有权限（fail-open，仅建议内网/信任环境）。
#                                 （权限判定走 local：管理员用 /soyshttp apikey grant <id|指纹> <权限> 为 key 配置权限）
api-key:
  local-fallback-all: false

# Cookie 属性（会话 / 记住我 cookie 统一拼装；群组服 SSO 共享用）：
#   cookie.domain   — Cookie Domain（默认空=精确 host）：
#                     · 同域名多端口部署：浏览器 cookie 按 host 不按端口，天然共享，无需配置；
#                     · 多子域名部署（srv1.example.com / srv2.example.com）：配 ".example.com"
#                       （前导点）→ 所有子域共享 cookie，零配置 SSO；
#                     · 额外域名（example.com 与 other.net）：任何 cookie 属性都救不了，
#                       走下方 sso 跨域票据回跳链。
#   cookie.secure   — false=默认；true=仅 HTTPS 下发送 cookie（跨域名回跳必须 HTTPS）。
#   cookie.same-site— Lax=默认（跨域顶层 GET 导航 / 302 回跳 Lax 即足够）；Strict=None 需配合 secure。
cookie:
  domain: ""
  secure: false
  same-site: Lax

# SSO 跨域回跳链（群组服多域名 / 额外域名兜底；同域名多端口 / 子域靠 cookie.* 自动共享，无需本段）：
#   sso.login-url      — 统一登录页地址（默认空=不启用回跳链）：
#                        浏览器 HTML 请求未登录时不再收 401 JSON，而是 302 跳到这里
#                        并附带 ?redirect=<原完整URL>。通常指向主站登录页
#                        （如 https://mc.example.com/login.html）。
#   sso.allowed-origins— 允许回跳的来源白名单（origin=scheme://host[:port]，列表）：
#                        仅当当前请求 origin 命中本列表才发 302（防开放跳转/被当跳板）；
#                        消费票据后的 callback 回跳目标 URL origin 也在本列表校验。
#                        例: ["https://mc.example.com", "https://srv2.example.com"]
# 链路: 子服 HTML 未登录 → 302 主站登录页?redirect=原地址 → 登录成功 mint 一次性票据
#       → 302 本子服 /api/auth/sso/callback?ticket=xxx → 消费换 cookie → 302 回目标页。
#       票据一次性 60s（复用 auto.login.ticket.ttl）；跨域名部署必须 HTTPS（cookie.secure: true）。
sso:
  login-url: ""
  allowed-origins: []