<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>权限不足 · SOYS HTTP-Over-MC</title>
<style>
  :root {
    --bg: #05060f; --panel: #0d1024; --line: #1c2142;
    --neon: #00f0ff; --neon2: #ff2bd6; --warn: #ffb020; --txt: #cfe9ff; --dim: #7d93b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    color: var(--txt); font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background:
      radial-gradient(700px 400px at 85% -10%, rgba(255,43,214,.14), transparent 60%),
      radial-gradient(600px 380px at -5% 30%, rgba(0,240,255,.12), transparent 60%),
      var(--bg);
  }
  .box {
    position: relative; text-align: center; padding: 46px 54px; max-width: 480px;
    background: linear-gradient(180deg, var(--panel), #090b1a);
    border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 0 34px rgba(255,176,32,.08);
  }
  .code { font-size: 40px; font-weight: 900; letter-spacing: 4px; color: var(--warn);
    text-shadow: 0 0 22px rgba(255,176,32,.4); line-height: 1.1; margin-bottom: 12px; }
  h1 { font-size: 20px; letter-spacing: 3px; color: #fff; margin-bottom: 12px; }
  p { font-size: 13.5px; color: var(--dim); line-height: 1.8; margin-bottom: 26px; }
  a.btn {
    display: inline-block; padding: 12px 34px; border-radius: 10px; text-decoration: none;
    font-size: 14px; font-weight: 700; letter-spacing: 2px;
    color: #04121a; background: linear-gradient(135deg, var(--neon), #37d5ff);
    box-shadow: 0 0 22px rgba(0,240,255,.4); transition: .2s; cursor: pointer; border: none;
  }
  a.btn:hover { transform: translateY(-2px); box-shadow: 0 0 34px rgba(0,240,255,.65); }

  /* 右上角 i 信息图标 */
  .info {
    position: absolute; top: 14px; right: 16px; width: 26px; height: 26px;
    border: 1px solid var(--line); border-radius: 50%;
    color: var(--dim); font-size: 15px; font-weight: 700; line-height: 24px; text-align: center;
    cursor: pointer; user-select: none; background: rgba(255,255,255,.03); transition: .2s;
  }
  .info:hover { color: var(--neon); border-color: var(--neon); box-shadow: 0 0 12px rgba(0,240,255,.35); }
  .tooltip {
    display: none; position: absolute; top: 46px; right: 16px; width: 300px;
    background: #0a0d1f; border: 1px solid var(--neon); border-radius: 12px;
    padding: 14px 16px; text-align: left; box-shadow: 0 6px 26px rgba(0,0,0,.5); z-index: 10;
  }
  .tooltip.show { display: block; }
  .tooltip .tip-title { font-size: 12px; letter-spacing: 2px; color: var(--neon); margin-bottom: 10px; font-weight: 700; }
  .tooltip .perm {
    font-family: Consolas, Menlo, monospace; font-size: 12px; color: var(--warn);
    background: rgba(255,176,32,.08); border: 1px solid rgba(255,176,32,.25);
    border-radius: 6px; padding: 6px 10px; margin: 6px 0; word-break: break-all;
  }
  .tooltip .tip-none { font-size: 12.5px; color: var(--dim); line-height: 1.7; }
</style>
</head>
<body>
<div class="box">
  <div class="info" id="info" title="缺少权限详情" tabindex="0">i</div>
  <div class="tooltip" id="tip">
    <div class="tip-title">缺少的权限</div>
    <div id="tipBody"><div class="tip-none">未携带权限信息。</div></div>
  </div>
  <div class="code">403</div>
  <h1>权限不足</h1>
  <p>你暂无访问该页面的权限，如有需要请联系服务器管理员。<br>点击右上角「i」查看具体缺少的权限节点。</p>
  <a class="btn" id="backBtn" href="javascript:void(0)">← 返回上一页</a>
</div>
<script>
(function () {
  try {
    var params = new URLSearchParams(window.location.search);
    var from = params.get('from');
    var missing = params.get('missing');
    var info = document.getElementById('info');
    var tip = document.getElementById('tip');
    var tipBody = document.getElementById('tipBody');
    var backBtn = document.getElementById('backBtn');

    // 返回按钮：优先跳回被阻挡前访问的页面，否则 history.back()
    if (from) {
      backBtn.href = from;
      backBtn.textContent = '← 返回上一页';
    }
    backBtn.addEventListener('click', function (e) {
      if (!from && window.history.length > 1) {
        e.preventDefault();
        window.history.back();
      }
    });

    // i 图标：点击 / 键盘切换浮层
    function toggle() {
      var show = tip.classList.toggle('show');
      info.style.color = show ? '#00f0ff' : '';
    }
    info.addEventListener('click', toggle);
    info.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
    document.addEventListener('click', function (e) {
      if (!tip.contains(e.target) && e.target !== info) tip.classList.remove('show');
    });

    // 填充缺失权限列表
    if (missing) {
      var items = missing.split(',').filter(function (s) { return s && s.trim(); });
      if (items.length) {
        tipBody.innerHTML = items.map(function (p) {
          return '<div class="perm">' + esc(p) + '</div>';
        }).join('');
      } else {
        tipBody.innerHTML = '<div class="tip-none">未携带权限信息。</div>';
      }
    } else {
      tipBody.innerHTML = '<div class="tip-none">未携带权限信息。</div>';
    }
  } catch (err) { /* 解析失败不阻断页面展示 */ }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
})();
</script>
</body>
</html>
