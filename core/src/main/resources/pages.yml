# ==== pages.yml —— 手动注册网页资源 / 跳转（可选，默认空） ====
# 每次服务器启动与 /soyshttp reload 时重新装配；全部使用【强制登记】，可覆盖核心或其它插件已注册的同路径页面。

# ============================================================================
#  前端资源目录（可选）
# ----------------------------------------------------------------------------
# - 留空（默认）：插件首次运行会把 jar 内置的 /dist/* 解压到插件数据目录的 web/ 文件夹
#   （即 plugins/SOYSHTTPOverMC/web/），并直接以该磁盘目录为前端根目录。
#   此后可直接编辑磁盘上的文件（index.html / news/ / status/ 等），刷新浏览器即生效，无需重构建；
#   已存在的文件不会被覆盖（保留你的修改），仅补回缺失的内置默认资源；磁盘缺失的文件回退 jar 内置。
# - 指定路径：优先从该目录读取静态文件（相对数据目录或绝对路径）。
# 支持路径：/、/index.html、/app.js、/styles.css、/api/status(动态JSON) 等。
web:
  root: "/dist"
  # ===== 首页（访问 / 时伺服的内容；留空=默认 web.root 下的 index.html → jar 内置 /dist/index.html 兜底）=====
  # 支持三种来源（修改后需重启生效）：
  #  - 相对/逻辑路径：如 "dist/index.html"（显式指定 jar 内置 dist 下页面）、"status/index.html"（按 web.root→jar /dist/ 顺序解析），正常情况下直接填写相对路径。
  #       例如 {@code /status/index.html}、{@code /index.html}；
  #  - 绝对路径：如 "C:/sites/home.html"（本地磁盘文件，直接伺服）；
  #  - 网络 URL：如 "https://example.com/home.html"（按需拉取并缓存约 5 分钟，拉取失败自动回退默认首页）。
  home: "/index.html"
  # ===== Web 内容存活缓存（缓解大量 web 资源长期驻留内存）=====
  # 仅对「惰性来源」生效（磁盘文件 / jar 资源，请求时读取）；registerPage 直接给定的字节不受控。
  cache:
    # LRU 缓存字节上限（默认 16MB）。仅约束「非常驻」文件；常驻（pinned）不计入此配额。
    max-bytes: 16777216
    # LRU 缓存条目数上限
    max-entries: 1024
    # 条目存活时间（秒）：超过后若无人再次访问即失效释放（下次访问重新加载）
    ttl-seconds: 60
    # 常驻内存清单：路径精确匹配或目录前缀（以 / 结尾）匹配。命中项直接进常驻内存，
    # 不参与淘汰、不占用 max-bytes（用于必须高频/快速响应的资源，如门户首页）。
    # 例：["/", "/assets/"]（"/" 精确匹配门户首页；"/assets/" 前缀匹配整个目录）
    pinned: [
      "/",
      "/assets/"
    ]
  # 大文件判定阈值（字节）：超过该大小的磁盘文件视为大文件——不写入缓存，
  # 交由「大文件加载抽象」处理（默认内置流式分块加载器；默认阈值 = cache.max-bytes）。
  large-file-threshold: 16777216
  # 大文件安全上限（字节）：超过直接拒绝加载（防单文件打爆内存，默认 128MB）
  large-file-max-bytes: 134217728

#
# 支持两种自动注册写法 pages.page 与 pages.auto：
#
# ◆ pages.page —— 显式页面（resource + 可选 nicknames / description）
#     "/路径":
#       nicknames:          # 昵称路由（别名 URL 路径）：访问昵称同样命中本页面
#         - "主页"
#       description: "..."  # 界面说明：/soyshttp pages 展示时自动拼接 “ —— ”+description
#       resource: <来源>    # 单个文件/资源；【不支持目录】按扩展名推断 Content-Type（.html 为 text/html）
#                             · 相对插件数据目录：  "web/notice.html"
#                             · 绝对磁盘路径：     "D:/sites/my-html/notice.html"
#                             · jar 内置资源：     "/dist/xxx.html"
#       permissions: [...]  # 网页访问权限（字符串数组，AND 语义，最高优先）；详情见文件尾部「网页访问权限」段
#
# ◆ pages.auto —— 平价注册：键 = URL 路径，值 = 来源
#     "/路径": <来源>
#       · 单文件/资源：如上（按扩展名推断类型）
#       · 目录：递归注册该文件夹下【所有 .html】文件，按相对路径挂载；配合键 "/" 即“写 / 注册文件夹下所有 html”
#       · 值以反引号包裹 => 登记 302 网络跳转： "/path": "`https://外部目标/`"（也可跳转站内路径）
#
# 修改后请执行 /soyshttp reload 或重启服务器生效。
pages:
  page:
    "/":
      nicknames:
        - "主页"
      description: "首页，可通过 '/主页' 昵称访问"
      resource: "dist/index.html"
  auto:
    # "/notice": "web/notice.html"
    "/": "dist/"
    "/link/mcmod": "`https://www.mcmod.cn/`"

  # ===== 网页访问权限（可选）=====
  # 两级配置，权限节点为【字符串数组】，判定为 AND 语义（数组内全部通过才放行，任一缺失 → 302）：
  #   1) pages.page.<路径>.permissions —— 单页内联（最高优先；与 pages.permissions 同路径时完全替换、不合并）
  #   2) pages.permissions            —— 全局路径规则（精确 /admin、目录通配 /console/*、全量 *）
  # 路径匹配复用 API 网关同款语义：/admin 精确（含 /admin/... 子路径）；/console/* 目录通配；* 全量。
  # 权限节点复用组合权限服务（含本地权限表 local）：可用 /soyshttp perm 为用户/组授予 soyshttp.page.xxx。
  # 未登录 → 302 登录页 login.html；已登录缺权限 → 302 权限不足提示页 /perm-denied.html（右上角 i 查看缺少的权限）。
  # 仅对 HTML 页/跳转生效（css/js/图片等资源不拦）。登录页与提示页自身永不拦截。
  # 示例：
  #   page:
  #     "/admin":
  #       resource: "dist/admin.html"
  #       permissions:
  #         - "soyshttp.page.admin"
  #         - "soyshttp.page.admin.manage"
  #   permissions:
  #     "/admin":     ["soyshttp.page.admin"]
  #     "/console/*": ["soyshttp.page.console"]
  permissions: {}