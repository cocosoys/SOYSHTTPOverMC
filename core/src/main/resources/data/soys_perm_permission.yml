# ============================================================================
# SOYSHTTPOverMC · 本地权限表（YAML 后端初始化模板）
# 表: soys_perm_permission（权限节点）
# ----------------------------------------------------------------------------
# · 存储位置: <插件数据文件夹>/data/soys_perm_permission.yml
# · 根节点:   soys_perm_permission（= @TableName，与 SQL 表名一致）
# · 记录键:   记录 ID（= @TableId 主键）
# · 列名:     实体字段驼峰转小写下划线，与 SQL 列名一致
# · 运行时:   文件不存在时后端自动创建空表；本文件仅作为初始化模板 / 格式参考
# ----------------------------------------------------------------------------
# 字段说明:
#   id          记录 ID（主键）
#   owner_type  归属类型: GROUP（权限组）/ USER（用户）
#   owner_id    归属 ID: 组 ID 或玩家 UUID（与 owner_type 对应）
#   permission  权限节点；":" 与 "." 等价（如 "test:ping" ≡ "test.ping"）
#   negative    负权限标记: true = 拒绝（节点以 - 开头写入时自动剥离前缀并置 true）
#   create_time  创建时间（yyyy-MM-dd HH:mm:ss）
# 示例记录（负权限）:
#   "p-1":
#     owner_type: "USER"
#     owner_id: "01234567-89ab-cdef-0123-456789abcdef"
#     permission: "test:ping"
#     negative: false
#     create_time: "2026-09-18 12:00:00"
#     update_time: "2026-09-18 12:00:00"
# ============================================================================
soys_perm_permission: {}
