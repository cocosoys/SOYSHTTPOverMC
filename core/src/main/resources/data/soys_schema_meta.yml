# ============================================================================
# SOYSHTTPOverMC · 自动运维元数据表（YAML 后端初始化模板）
# 表: soys_schema_meta（记录每表归属插件 / schema 版本 / 已执行脚本）
# ----------------------------------------------------------------------------
# · 存储位置: <插件数据文件夹>/data/soys_schema_meta.yml
#             （目录由 config.yml 的 storage.backends.yaml.file 指定，默认 data/）
# · 根节点:   soys_schema_meta（= @TableName，与 SQL 表名一致）
# · 记录键:   id = "<plugin>:<table_name>"（组合主键，dlz 单主键约束下的逻辑双主键）
# · 列名:     实体字段驼峰转小写下划线（createdAt → created_at），与 SQL 列名一致
# · 运行时:   文件不存在时后端自动创建空表；本文件仅作为初始化模板 / 格式参考，
#             由自动运维（Auto Ops）复制到数据文件夹（已存在不覆盖）
# ----------------------------------------------------------------------------
# 字段说明:
#   id               组合主键（如 "SOYSHTTPOverMC:soys_perm_user"）
#   plugin           归属插件（主插件名 / Expansion identifier）
#   table_name       表名（"*" = 插件级迁移记录；否则为 ORM 表名 / YAML 文件名）
#   schema_version   当前 schema 版本（已应用最高迁移版本，如 0/1/2…）
#   state            状态（INSTALLED / UNINSTALLED，预留）
#   executed_scripts 已执行脚本 JSON 数组（插件级行使用，如 ["init.sql","V1__demo.sql"]）
#   created_at       创建时间（毫秒时间戳字符串）
#   updated_at       最后更新时间（毫秒时间戳字符串）
# ----------------------------------------------------------------------------
# 记录示例（首次安装后由自动运维写入；本模板保持空表）:
#   soys_schema_meta:
#     "SOYSHTTPOverMC:*":
#       plugin: SOYSHTTPOverMC
#       table_name: "*"
#       schema_version: 1
#       state: INSTALLED
#       executed_scripts: '["init.sql","V1__demo.sql"]'
#       created_at: "1720000000000"
#       updated_at: "1720000000000"
# ============================================================================
soys_schema_meta:
