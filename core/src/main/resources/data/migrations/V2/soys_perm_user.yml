# ==============================================================
#  V2 YAML 迁移：soys_perm_user 补充 vip_level 字段（默认 '0'）
# ==============================================================
#  YAML 通道声明式迁移（SQL 通道见 sql/migrations/V2/soys_perm_user.sql）：
#    - 目标表 = 文件名（<表名>.yml → soys_perm_user），脚本无需 table；
#    - add-fields: 补列集合——对既有每条记录，缺失该键则写入默认值；
#    - 每脚本只执行一次（meta 记录）；升级到 V2 自动执行本脚本。
# ==============================================================
add-fields:
  vip_level: "0"