# ============================================================================
# SOYSHTTPOverMC · 本地权限表（YAML 后端初始化模板）
# 表: soys_perm_group（权限组定义）
# ----------------------------------------------------------------------------
# · 存储位置: <插件数据文件夹>/data/soys_perm_group.yml
# · 根节点:   soys_perm_group（= @TableName，与 SQL 表名一致）
# · 记录键:   权限组 ID（= @TableId 主键）
# · 列名:     实体字段驼峰转小写下划线，与 SQL 列名一致
# · 运行时:   文件不存在时后端自动创建空表；本文件仅作为初始化模板 / 格式参考
# ----------------------------------------------------------------------------
# 字段说明:
#   id          权限组 ID（主键；小写规范化）
#   display     显示名
#   prefix      前缀（如聊天前缀）
#   weight      权重（int，数字越大优先级越高）
#   description 描述
#   created_at  创建时间（yyyy-MM-dd HH:mm:ss）
#   updated_at  最后更新时间（yyyy-MM-dd HH:mm:ss）
# 示例记录:
#   "admin":
#     display: "管理员"
#     prefix: "&c[管理]"
#     weight: 100
#     description: ""
#     created_at: "1759000000000"
#     updated_at: "1759000000000"
# ============================================================================
soys_perm_group: {}
