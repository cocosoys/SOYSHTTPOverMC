# ============================================================================
# SOYSHTTPOverMC · SSO 一次性登录票据表（YAML 后端初始化模板）
# 表: soys_sso_ticket（游戏内免登链接 / 跨域名 SSO 回跳共用）
# ----------------------------------------------------------------------------
# · 存储位置: <插件数据文件夹>/data/soys_sso_ticket.yml
# · 根节点:   soys_sso_ticket（= @TableName，与 SQL 表名一致）
# · 记录键:   自增 id（YAML 端由 ORM 分配 max+1）
# · 列名:     实体字段驼峰转小写下划线，与 SQL 列名一致
# · 运行时:   文件不存在时后端自动创建空表；本文件仅作为初始化模板 / 格式参考
# · 语义:     一次性、短 TTL（默认 60s）；消费置 consumed_at（保留审计行，不删行）；
#            过期行由读取方惰性清理（短命票，无定时任务）。
# · 群组服:   接同一 MySQL 时票据全局可消费（跨域名 SSO）；YAML = 独立服仅本服有效。
# ----------------------------------------------------------------------------
# 字段说明:
#   id             自增主键
#   ticket         票据串（tk_ 前缀随机，业务查询键，全局唯一）
#   subject        绑定玩家名（消费后据此换发会话）
#   redirect_url   目标回跳地址（跨域 SSO 用；游戏内链接场景为空）
#   issued_server  签发服标识（群组服 server-name / 独立服 standalone-<host>:<port>）
#   client_ip      客户端 IP（空 = 不绑定）
#   consumed_at    消费毫秒时间戳（空 = 未消费；非空 = 已消费，重复消费拒绝）
#   expires_at     过期毫秒时间戳（超过即视为无效）
#   create_time    创建时间（yyyy-MM-dd HH:mm:ss）
#   update_time    最后更新时间（yyyy-MM-dd HH:mm:ss）
# 示例记录（键为自增 id）:
#   1:
#     ticket: "tk_Ab12Cd34Ef56Gh78"
#     subject: "Steve"
#     redirect_url: "https://mc.example.com/web/plugins/MCERP/"
#     issued_server: "lobby"
#     client_ip: "203.0.113.10"
#     consumed_at: ""
#     expires_at: 1757385660000
#     create_time: "2026-09-09 12:00:00"
#     update_time: "2026-09-09 12:00:00"
# ============================================================================
soys_sso_ticket: {}
