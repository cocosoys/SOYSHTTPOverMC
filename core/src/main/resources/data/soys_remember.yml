# ============================================================================
# SOYSHTTPOverMC · 记住我凭证表（YAML 后端初始化模板）
# 表: soys_remember（自动登录 / 设备免登录凭证）
# ----------------------------------------------------------------------------
# · 存储位置: <插件数据文件夹>/data/soys_remember.yml
# · 根节点:   soys_remember（= @TableName，与 SQL 表名一致）
# · 记录键:   凭证 ID（jti，= @TableId 主键）
# · 列名:     实体字段驼峰转小写下划线，与 SQL 列名一致
# · 运行时:   文件不存在时后端自动创建空表；本文件仅作为初始化模板 / 格式参考
# ----------------------------------------------------------------------------
# 字段说明:
#   jti        凭证 ID（JWT jti，主键）
#   player     玩家名
#   issued_at  签发时间（yyyy-MM-dd HH:mm:ss）
#   expires_at 过期时间（yyyy-MM-dd HH:mm:ss；过期凭证会被自动清理 / 拉黑）
# 示例记录:
#   "jwt-jti-xxxx":
#     player: "Steve"
#     issued_at: "1759000000000"
#     expires_at: "1769600000000"
# ============================================================================
soys_remember: {}
