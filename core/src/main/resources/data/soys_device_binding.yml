# ============================================================================
# SOYSHTTPOverMC · 设备绑定表（YAML 后端初始化模板）
# 表: soys_device_binding（“记住我”Cookie + 设备指纹双因子）
# ----------------------------------------------------------------------------
# · 存储位置: <插件数据文件夹>/data/soys_device_binding.yml
# · 根节点:   soys_device_binding（= @TableName，与 SQL 表名一致）
# · 记录键:   自增主键 id（SQL 端 AUTO_INCREMENT / SQLite AUTOINCREMENT；YAML 端由 ORM 分配 max+1）
# · 列名:     实体字段驼峰转小写下划线，与 SQL 列名一致
# · 运行时:   文件不存在时后端自动创建空表；本文件仅作为初始化模板 / 格式参考
# ----------------------------------------------------------------------------
# 字段说明:
#   id              自增主键（Long）
#   player          玩家名（联合唯一索引之一；一个玩家可绑定多台设备）
#   uuid            玩家 UUID（可空，绑定/登录时回填；改名后以 uuid 为准）
#   fingerprint_hash 设备指纹哈希（SHA-256(玩家名|原始指纹|服务端盐)，仅存哈希，不落原始指纹）
#   device_label    设备描述（UA 摘要，仅展示）
#   last_ip         最后成功绑定/登录 IP（弱校验参考，不进判定）
#   last_bind_at    最后绑定时刻（yyyy-MM-dd HH:mm:ss）
#   revoked         弃用标记: 1 = 设备已弃用（不参与判定）
#   create_time    创建时间（yyyy-MM-dd HH:mm:ss）
#   update_time    最后更新时间（yyyy-MM-dd HH:mm:ss）
# 示例记录:
#   "1":
#     player: "Steve"
#     uuid: "069a79f4-44e9-4726-a5be-fca90e38aaf5"
#     fingerprint_hash: "9f2b…（64 位十六进制）"
#     device_label: "Chrome/126 Windows"
#     last_ip: "127.0.0.1"
#     last_bind_at: "2026-09-24 12:00:00"
#     revoked: 0
# ============================================================================
soys_device_binding: {}
