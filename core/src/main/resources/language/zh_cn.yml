command.lang.detail: "/soyshttp lang —— 显示当前语言及可用语言列表。\n/soyshttp lang <代码> —— 切换到指定语言（需 language/<代码>.yml 存在）。\n/soyshttp lang sources —— 列出当前全部语言源及其提供的翻译条数。\n/soyshttp lang sources on/off <索引> —— 启用/停用指定来源的翻译。\n/soyshttp lang sources download <索引> —— 将网络来源翻译下载到本地缓存（离线可用）。\n/soyshttp lang sources update <索引> —— 更新本地网络翻译（本地不存在则自动下载）。\n/soyshttp lang sources remove <索引> —— 删除本地网络翻译并从内存卸载。\n/soyshttp lang sources info <索引> —— 查看来源详细信息。\n例子：/soyshttp lang en_us"
