command.perm.usage: "§e用法：/soyshttp perm group|user|check|reload ...（详见 /soyshttp help perm）"
command.perm.reloaded: "§a已重新加载权限提供者组合（含本地表）"
command.perm.unknown-action: "§c未知子动作：§f{0} §c（支持 group/user/check/reload）"
command.apikey.usage-short: "/soyshttp apikey —— X-API-Key 本地表管理（生成/启停/过期/绑定/权限，认证门与权限门共用）"
command.apikey.detail: "/soyshttp apikey —— X-API-Key 本地表管理（soys_api_key；替代旧 auth.yml 静态 keys）。\ncreate [备注] —— 生成新 key（明文仅本次展示；库中只存 SHA-256 哈希 + 8 位指纹）\nlist —— 列出全部 key\ninfo <id|指纹> —— 查看单个 key 详情\nremove <id|指纹> —— 删除 key（连带权限记录）\nenable|disable <id|指纹> —— 启用 / 停用\nexpiry <id|指纹> <yyyy-MM-dd HH:mm:ss|clear> —— 设置 / 清除过期\nbind <id|指纹> <玩家|UUID> —— 绑定玩家（归一到 UUID；一期仅存储）\nunbind <id|指纹> —— 解除绑定\ngrant|revoke <id|指纹> <权限> —— 加 / 删权限（- 前缀=否定；: ≡ .）\nperms <id|指纹> —— 列出权限记录\n仅 op 可执行"
command.apikey.usage: "§e用法：/soyshttp apikey create|list|info|remove|enable|disable|expiry|bind|unbind|grant|revoke|perms ...（详见 /soyshttp help apikey）"
