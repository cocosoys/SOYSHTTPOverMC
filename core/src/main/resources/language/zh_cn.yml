command.perm.usage-short: "/soyshttp perm —— 本地内置权限表（组/用户 CRUD + 查询），配套 permission.offline-fallback: local"
command.perm.detail: "本地内置权限表管理（offline-fallback=local 的配套表，同时服务 API 权限与网页权限）。\n组：perm group create|delete|weight|add|remove|list\n用户：perm user <玩家> group add|remove <组> / add|remove <权限> / list / expiry <yyyy-MM-dd HH:mm:ss|clear>\n调试：perm check <玩家> <权限>\n节点规则：':' ≡ '.'（test:ping ≡ test.ping）；'-' 前缀=否定；'*' 全量通配；'a.*' 段级通配。\n仅 op 可执行。"
