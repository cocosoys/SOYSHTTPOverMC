command.perm.usage-short: "/soyshttp perm — local built-in permission table (group/user CRUD + query), for permission.offline-fallback: local"
command.perm.detail: "Manage the local built-in permission table (the companion store of offline-fallback=local, serving both API permissions and web page permissions).\nGroups: perm group create|delete|weight|add|remove|list\nUsers: perm user <player> group add|remove <group> / add|remove <permission> / list / expiry <yyyy-MM-dd HH:mm:ss|clear>\nDebug: perm check <player> <permission>\nNode rules: ':' ≡ '.' (test:ping ≡ test.ping); '-' prefix = negated; '*' full wildcard; 'a.*' segment wildcard.\nOP only."
command.perm.service-not-ready: "§cPermission service not ready yet, try again later"
command.perm.usage: "§eUsage: /soyshttp perm group|user|check|reload ... (see /soyshttp help perm)"
command.perm.reloaded: "§aPermission provider chain reloaded (incl. local table)"
command.perm.unknown-action: "§cUnknown sub-action: §f{0} §c(supported: group/user/check/reload)"
command.apikey.usage-short: "/soyshttp apikey —— X-API-Key local table management (generate/enable/expiry/bind/permissions; shared by auth & permission gates)"
command.apikey.detail: "/soyshttp apikey —— X-API-Key local table (soys_api_key; replaces legacy auth.yml static keys).\ncreate [remark] —— generate a new key (plaintext shown once; store keeps only SHA-256 hash + 8-char fingerprint)\nlist —— list all keys\ninfo <id|fingerprint> —— show key details\nremove <id|fingerprint> —— delete key (with its permission records)\nenable|disable <id|fingerprint> —— enable / disable\nexpiry <id|fingerprint> <yyyy-MM-dd HH:mm:ss|clear> —— set / clear expiry\nbind <id|fingerprint> <player|UUID> —— bind player (normalized to UUID; stored only in phase 1)\nunbind <id|fingerprint> —— unbind player\ngrant|revoke <id|fingerprint> <permission> —— add / remove permission (- prefix = negative; : ≡ .)\nperms <id|fingerprint> —— list permission records\nop only"
command.apikey.usage: "§eUsage: /soyshttp apikey create|list|info|remove|enable|disable|expiry|bind|unbind|grant|revoke|perms ... (see /soyshttp help apikey)"
command.apikey.unknown-action: "§cUnknown sub-action: §f{0} §c(supported: create/list/info/remove/enable/disable/expiry/bind/unbind/grant/revoke/perms)"
