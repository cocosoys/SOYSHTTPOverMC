# ============ SOYSHTTPOverMC English language pack ============
# Flat dotted-path keys (flattened into an in-memory Map by YamlConfiguration.getKeys(true) on load).
# Business code reads via I18n.t("key", "fallback", args...); if a key is missing it falls back to the in-code fallback text.
# Placeholders use {0} {1} ... (I18n.format replaces them via String.replace("{i}", arg)).
# Language files are stored in the plugin data folder under language/, the file name is the language code.
# To customize, edit <server>/plugins/SOYSHTTPOverMC/language/en_us.yml, then restart or run /soyshttp reload.

