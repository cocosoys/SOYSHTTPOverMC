command.lang.detail: "/soyshttp lang —— show the current language and the available language list.\n/soyshttp lang <code> —— switch to the given language (requires language/<code>.yml to exist).\n/soyshttp lang sources —— list all language sources and the translation count each provides.\n/soyshttp lang sources on/off <index> —— enable/disable a source.\n/soyshttp lang sources download <index> —— download a network source's translations to local cache (works offline).\n/soyshttp lang sources update <index> —— update local network translations (auto-downloads if not cached).\n/soyshttp lang sources remove <index> —— delete local network translations and unload from memory.\n/soyshttp lang sources info <index> —— view source details.\nexample: /soyshttp lang en_us"
